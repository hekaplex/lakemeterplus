bundle:
  name: lakemeter-installer

# Observability-module variables, merged in from
# databricks-cost-observability's databricks.yml (see
# ../../docs/merge-tasks.md task #13). NOTE: that source repo's bundle
# declared the app itself as a DAB `resources.apps:` resource with its own
# `permissions:` block; that pattern is NOT ported here, because this
# bundle's app is created and configured *imperatively* by
# notebooks/05a_create_app.py via the Databricks SDK, not declaratively by
# the bundle. Declaring both a `resources.apps:` block AND creating the
# same app via SDK calls in a notebook would fight over ownership of the
# same app resource — so the merge is instead: these variables get threaded
# through as job parameters into notebooks/05a_create_app.py, which now
# also writes the observability module's env vars into the generated
# app.yaml (MOCK_MODE, DATABRICKS_WAREHOUSE_ID, UC_CATALOG_NAME,
# ALLOWED_USERS, ADMIN_USERS). App-level workspace ACLs (CAN_USE/CAN_MANAGE)
# are not set up by either installer path today — see docs/TODO.md.
variables:
  warehouse_id:
    description: "SQL Warehouse ID the observability module runs billing queries against. Leave blank with mock_mode=true for a demo install."
    default: ""
  catalog_name:
    description: "Unity Catalog name the observability module reads/writes (app_user_permissions, cloud_platform_costs tables)"
    default: "workspace"
  mock_mode:
    description: "Observability module: use mock_system_* Delta tables instead of real system.* tables (true = demo/dev, false = production, requires warehouse_id and system table enablement)"
    default: "true"
  admin_users:
    description: "Comma-separated emails allowed to access the observability module's Admin panel"
    default: ""

sync:
  include:
    - "notebooks/**"
    - "pricing_data/**"
    - "app_source/**"
    - "functions/**"
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"

resources:
  jobs:
    lakemeter_installer:
      name: "Lakemeter Installer"
      parameters:
        - name: instance_name
          default: "lakemeter-customer"
        - name: db_name
          default: "lakemeter_pricing"
        - name: app_name
          default: "lakemeter"
        - name: secrets_scope
          default: "lakemeter-secrets"
        - name: claude_endpoint
          default: "databricks-claude-opus-4-6"
        # ── Observability module (see docs/merge-tasks.md task #13) ──────
        - name: warehouse_id
          default: "${var.warehouse_id}"
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: mock_mode
          default: "${var.mock_mode}"
        - name: admin_users
          default: "${var.admin_users}"

      # Task dependency graph (parallel where possible):
      #
      #   01_provision (26s)  ║  05a_create_app (~3min)   ← parallel from start
      #         │             ║        │
      #   02_create_db (17s)  ║        │
      #         │             ╠════════╝
      #     ┌───┴──────┐      │
      #   02b_funcs  03_data  05b_grant_sp (~30s)
      #     (12s)    (19s)         │
      #               │      06_deploy_app (10m41s)
      #          04_sku (10s)      │
      #                       07_verify (~30s)
      #
      tasks:
        # ── Branch 1: Database provisioning ──────────────────────────────
        - task_key: provision_lakebase
          notebook_task:
            notebook_path: ./notebooks/01_provision_lakebase.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
          environment_key: serverless_env

        - task_key: create_database
          depends_on:
            - task_key: provision_lakebase
          notebook_task:
            notebook_path: ./notebooks/02_create_database.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        - task_key: create_functions
          depends_on:
            - task_key: create_database
          notebook_task:
            notebook_path: ./notebooks/02b_create_functions.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: serverless_env

        - task_key: load_pricing_data
          depends_on:
            - task_key: create_database
          notebook_task:
            notebook_path: ./notebooks/03_load_pricing_data.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        - task_key: create_sku_mapping
          depends_on:
            - task_key: load_pricing_data
          notebook_task:
            notebook_path: ./notebooks/04_create_sku_mapping.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: serverless_env

        # ── Branch 2: App creation (parallel with DB provisioning) ──────
        - task_key: create_app
          notebook_task:
            notebook_path: ./notebooks/05a_create_app.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              app_name: "{{job.parameters.app_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
              claude_endpoint: "{{job.parameters.claude_endpoint}}"
              warehouse_id: "{{job.parameters.warehouse_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              mock_mode: "{{job.parameters.mock_mode}}"
              admin_users: "{{job.parameters.admin_users}}"
          environment_key: serverless_env

        # ── Merge point: grant SP access (needs app + database) ─────────
        - task_key: grant_app_access
          depends_on:
            - task_key: create_app
            - task_key: create_database
          notebook_task:
            notebook_path: ./notebooks/05b_grant_app_access.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              app_name: "{{job.parameters.app_name}}"
          environment_key: serverless_env

        # ── Deploy (needs app configured + SP granted) ──────────────────
        - task_key: deploy_app
          depends_on:
            - task_key: grant_app_access
          notebook_task:
            notebook_path: ./notebooks/06_deploy_app.py
            base_parameters:
              app_name: "{{job.parameters.app_name}}"
          environment_key: serverless_env

        # ── Verify (smoke tests against deployed app) ─────────────────
        - task_key: verify_installation
          depends_on:
            - task_key: deploy_app
          notebook_task:
            notebook_path: ./notebooks/07_verify_installation.py
            base_parameters:
              app_name: "{{job.parameters.app_name}}"
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

# Dev/prod targets for the observability module's mock_mode, mirroring
# databricks-cost-observability's own dev/prod split (see task #13). This
# only affects the `mock_mode` variable threaded into the generated
# app.yaml (via notebooks/05a_create_app.py) — it does not change how or
# where Lakebase/the app itself get provisioned, which is identical
# between targets (that split doesn't exist in Lakemeter's own installer).
targets:
  dev:
    mode: development
    default: true
    variables:
      mock_mode: "true"
  prod:
    mode: production
    variables:
      mock_mode: "false"
      # warehouse_id and admin_users have no safe default for prod — pass
      # them explicitly: `databricks bundle deploy -t prod --var
      # warehouse_id=<id> --var admin_users=<emails>`
